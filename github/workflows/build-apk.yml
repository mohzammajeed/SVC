name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: read

env:
  # Run JavaScript-based actions on Node.js 24 (Node.js 20 is deprecated on GitHub runners)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SoftVCompressor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
